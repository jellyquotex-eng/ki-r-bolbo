<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F1">
<title>Pookie Wife?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --cream:#FBF8F1; --pink:#F6D5DD; --pink-deep:#EBA9BA; --rose:#B9657F;
  --sky:#CFE4F2; --sky-deep:#9CC6E3; --olive:#6B7A4F; --olive-deep:#4F5B38; --olive-soft:#B4BF95;
  --serif:"Cormorant Garamond",Georgia,serif; --hand:"Patrick Hand","Bradley Hand","Comic Sans MS",cursive;
  --sans:Inter,"SF Pro Text","Helvetica Neue",Arial,system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.12,1);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; width:100%; overflow:hidden; background:var(--cream); overscroll-behavior:none; }
body{ font-family:var(--sans); color:var(--olive-deep); text-align:center; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; }

/* ============ AMBIENT (3 effects: blobs, floating hearts canvas, touch trail) ============ */
.atmos{ position:fixed; inset:0; z-index:0; overflow:hidden; }
.blob{ position:absolute; width:70vmax; height:70vmax; border-radius:50%; opacity:.7; will-change:transform; }
.b1{ background:radial-gradient(circle,var(--pink),transparent 66%); left:-25vmax; top:-22vmax; animation:d1 32s ease-in-out infinite alternate; }
.b2{ background:radial-gradient(circle,var(--sky),transparent 66%); right:-28vmax; bottom:-22vmax; animation:d2 38s ease-in-out infinite alternate; }
.b3{ background:radial-gradient(circle,var(--olive-soft),transparent 66%); left:25vw; top:35vh; opacity:.35; animation:d1 44s ease-in-out infinite alternate-reverse; }
@keyframes d1{ to{ transform:translate3d(12vmax,9vmax,0) scale(1.1); } }
@keyframes d2{ to{ transform:translate3d(-10vmax,-12vmax,0) scale(1.12); } }
#fx,#trail{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
#trail{ z-index:60; }

/* ============ SCENES ============ */
.scene{ position:fixed; inset:0; z-index:2; display:grid; place-items:center; padding:max(5vw,env(safe-area-inset-top)) 5vw max(5vw,env(safe-area-inset-bottom));
  opacity:0; visibility:hidden; filter:blur(10px); transform:scale(1.03); overflow-y:auto;
  transition:opacity 1s var(--ease), filter 1s var(--ease), transform 1.2s var(--ease), visibility 0s 1s; }
.scene.active{ opacity:1; visibility:visible; filter:none; transform:none; transition:opacity 1s var(--ease), filter 1s var(--ease), transform 1.2s var(--ease); }
.glass{ position:relative; width:min(92vw,560px); padding:2.3rem 1.6rem; border-radius:30px;
  background:linear-gradient(145deg,rgba(255,255,255,.74),rgba(255,255,255,.44));
  -webkit-backdrop-filter:blur(18px) saturate(1.2); backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid rgba(255,255,255,.9); box-shadow:0 30px 70px rgba(107,122,79,.15),0 6px 18px rgba(156,198,227,.2),inset 0 1px 0 #fff; }
.shine{ background:linear-gradient(100deg,var(--olive-deep) 20%,var(--rose) 40%,var(--sky-deep) 50%,var(--rose) 60%,var(--olive-deep) 80%);
  background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; animation:shimmer 7s linear infinite; }
@keyframes shimmer{ to{ background-position:-250% 0; } }
button{ font-family:inherit; cursor:pointer; border:none; min-height:48px; }

/* ============ 1 · NAME ============ */
.prompt{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:clamp(1.8rem,6.4vw,2.9rem); line-height:1.2; margin-bottom:1.8rem; }
#nameForm{ display:flex; flex-direction:column; align-items:center; gap:1.2rem; }
#nameInput{ width:100%; font:600 1.35rem var(--sans); text-align:center; padding:1.1rem 1.3rem; border-radius:999px; border:2.5px solid var(--olive); background:#fff; color:var(--olive-deep); outline:none;
  user-select:text; -webkit-user-select:text; animation:ring 2.8s ease-in-out infinite; transition:border-color .3s; }
#nameInput::placeholder{ color:#8d9a74; font-weight:400; }
#nameInput:focus{ border-color:var(--rose); animation:none; box-shadow:0 0 0 7px rgba(246,213,221,.85); }
@keyframes ring{ 0%,100%{ box-shadow:0 0 0 0 rgba(156,198,227,.7); } 50%{ box-shadow:0 0 0 12px rgba(156,198,227,0); } }
.btn{ position:relative; overflow:hidden; padding:.9rem 2.6rem; border-radius:999px; color:#fff; font-size:1.05rem; letter-spacing:.04em; background:linear-gradient(135deg,#7F9060,#5A6A3E); transition:transform .3s var(--ease); }
.btn::after{ content:""; position:absolute; top:0; left:-80%; width:50%; height:100%; transform:skewX(-20deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent); animation:sweep 3.6s ease-in-out infinite; }
@keyframes sweep{ 0%,55%{ left:-80%; } 100%{ left:140%; } }
.btn:active{ transform:scale(.95); }

/* ============ 2 · CHAT ============ */
.who{ display:inline-flex; align-items:center; gap:.5rem; margin-bottom:1.1rem; padding:.35rem .95rem; border-radius:999px; font:600 .9rem var(--serif); letter-spacing:.1em;
  color:var(--olive); background:rgba(255,255,255,.7); border:1px solid var(--sky); }
.who b{ width:8px; height:8px; border-radius:50%; background:var(--olive-soft); animation:pulse 1.8s ease-in-out infinite; }
@keyframes pulse{ 50%{ transform:scale(1.7); opacity:.4; } }
.slot{ min-height:8.5em; display:grid; place-items:center; }
.msg{ font-family:var(--serif); font-weight:500; font-size:clamp(1.5rem,5.2vw,2.4rem); line-height:1.4; transition:opacity .5s, transform .5s; }
.msg.out{ opacity:0; transform:translateY(-12px); }
.cur{ display:inline-block; width:.45em; height:1em; margin-left:4px; vertical-align:-.12em; border-radius:2px; background:var(--pink-deep); animation:blink 1s steps(2) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.dots{ display:none; gap:.5rem; }
.dots i{ width:11px; height:11px; border-radius:50%; background:var(--olive-soft); animation:bounce 1s ease-in-out infinite; }
.dots i:nth-child(2){ animation-delay:.15s; background:var(--sky-deep); } .dots i:nth-child(3){ animation-delay:.3s; background:var(--pink-deep); }
@keyframes bounce{ 0%,60%,100%{ transform:none; opacity:.4; } 30%{ transform:translateY(-9px); opacity:1; } }
.think .msg{ display:none; } .think .dots{ display:flex; }

/* ============ 3 · PROPOSAL ============ */
.steps{ display:flex; gap:.6rem; justify-content:center; margin-bottom:1rem; }
.steps i{ font-style:normal; font-size:1.3rem; color:var(--sky-deep); opacity:.45; transition:all .5s cubic-bezier(.34,1.56,.64,1); }
.steps i.on{ color:var(--pink-deep); opacity:1; transform:scale(1.25); }
.question{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:clamp(2.1rem,8vw,3.8rem); line-height:1.15; min-height:2.4em; display:grid; place-items:center; margin-bottom:.6rem; }
.question span.w{ display:inline-block; white-space:nowrap; }
.ch{ display:inline-block; opacity:0; filter:blur(14px); transform:translateY(.25em) scale(1.25);
  background:linear-gradient(100deg,var(--olive-deep),var(--rose),var(--sky-deep),var(--olive-deep)); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:shimmer 7s linear infinite;
  transition:opacity 1.1s var(--ease) var(--d), filter 1.3s var(--ease) var(--d), transform 1.4s cubic-bezier(.34,1.4,.64,1) var(--d); }
.reveal .ch{ opacity:1; filter:none; transform:none; }
.plea{ min-height:3.4em; font-size:clamp(1rem,3.8vw,1.35rem); color:var(--rose); margin-bottom:1.6rem; }
.row{ display:flex; gap:1.6rem; align-items:center; justify-content:center; flex-wrap:wrap; min-height:110px; }
#yesBtn,#noBtn{ border-radius:999px; color:#fff; transition:transform .5s var(--ease), opacity .5s; }
#yesBtn{ font-size:1.3rem; padding:1rem 2.5rem; background:linear-gradient(135deg,#7F9060,#5A6A3E); animation:glow 2.6s ease-in-out infinite; }
@keyframes glow{ 0%,100%{ box-shadow:0 8px 24px rgba(107,122,79,.3),0 0 0 0 rgba(156,198,227,.6); } 50%{ box-shadow:0 12px 30px rgba(107,122,79,.4),0 0 0 14px rgba(156,198,227,0); } }
#noBtn{ font-size:1.1rem; padding:.9rem 2rem; background:linear-gradient(135deg,#B7D8EE,#8DBBDC); }
#noBtn:disabled{ pointer-events:none; }

/* ============ 4 · FINAL ============ */
#scr-final{ font-family:var(--hand); }
.paper{ position:relative; z-index:2; width:min(92vw,470px); padding:1.2rem 1.1rem 1.8rem; border-radius:6px; background:#FFFEFA;
  background-image:repeating-linear-gradient(transparent 0 29px,rgba(156,198,227,.45) 29px 30px);
  box-shadow:0 30px 60px rgba(107,122,79,.22),0 2px 6px rgba(0,0,0,.07);
  opacity:0; transform:rotate(-4deg) scale(.85) translateY(30px); transition:opacity 1s var(--ease), transform 1.4s var(--ease); }
.reveal .paper{ opacity:1; transform:rotate(-1.5deg); }
.paper::before,.paper::after{ content:""; position:absolute; top:-12px; width:80px; height:24px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
.paper::before{ left:-16px; transform:rotate(-34deg); background:rgba(246,213,221,.92); }
.paper::after{ right:-16px; transform:rotate(34deg); background:rgba(180,191,149,.92); }
.paper svg{ width:100%; height:auto; display:block; overflow:visible; }
.dr{ fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; }
.reveal .dr{ animation:draw var(--t,1.3s) var(--ease) var(--d,0s) forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
.pop,.fade{ opacity:0; }
.reveal .pop{ animation:pop .8s cubic-bezier(.34,1.56,.64,1) var(--d,0s) forwards; }
.reveal .fade{ animation:fin 1.2s ease var(--d,0s) forwards; }
@keyframes pop{ 0%{ opacity:0; transform:scale(0) rotate(-20deg); } 100%{ opacity:1; transform:none; } }
@keyframes fin{ to{ opacity:1; } }
.pop,.beat{ transform-box:fill-box; transform-origin:center; }
.reveal .beat{ animation:beat 1.8s ease-in-out 6s infinite; }
@keyframes beat{ 0%,100%{ transform:none; } 14%{ transform:scale(1.05); } 28%{ transform:none; } 42%{ transform:scale(1.03); } }
.spk{ opacity:0; fill:#fff; stroke:var(--sky-deep); stroke-width:1.6; transform-box:fill-box; transform-origin:center; }
.reveal .spk{ animation:tw 2.4s ease-in-out var(--d) infinite; }
@keyframes tw{ 0%,100%{ opacity:0; transform:scale(.3); } 50%{ opacity:1; transform:scale(1.1) rotate(14deg); } }
.accept{ min-height:7.4em; margin-top:.3rem; }
.accept p{ font-size:clamp(1.05rem,3.9vw,1.3rem); line-height:1.45; }
.accept p:first-child{ font-size:clamp(1.5rem,5.8vw,2rem); color:var(--rose); }
.accept .small{ font-size:.95rem; color:var(--olive); }
.sign{ position:absolute; left:1.1rem; bottom:.5rem; max-width:55%; font-size:.9rem; line-height:1.2; color:var(--olive); transform:rotate(-3deg); opacity:0; transition:opacity 1.6s; text-align:left; }
.sign.on{ opacity:.95; }
.seal{ position:absolute; right:-20px; bottom:-28px; width:108px; height:108px; z-index:4; opacity:0; pointer-events:none; filter:drop-shadow(0 8px 12px rgba(79,91,56,.3)); }
.seal.on{ animation:stamp .75s cubic-bezier(.2,.9,.3,1.15) forwards; }
.seal.on::before{ content:""; position:absolute; inset:0; border-radius:50%; border:3px solid var(--sky-deep); opacity:0; animation:shock 1.1s ease-out .5s forwards; }
@keyframes stamp{ 0%{ opacity:0; transform:scale(3.2) rotate(-40deg); } 55%{ opacity:1; transform:scale(.9) rotate(-10deg); } 100%{ opacity:1; transform:scale(1) rotate(-14deg); } }
@keyframes shock{ 0%{ opacity:.9; transform:scale(1); } 100%{ opacity:0; transform:scale(3); } }
.seal .ring{ transform-origin:60px 60px; animation:spin 26s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* easter egg */
.egg{ position:absolute; top:-6px; right:10px; z-index:5; width:48px; height:48px; background:none; font-size:1.2rem; color:var(--pink-deep); opacity:.55; animation:hb 2.4s ease-in-out infinite; }
@keyframes hb{ 0%,100%{ transform:scale(1); } 20%{ transform:scale(1.25); } 40%{ transform:scale(1.05); } }
#eggMsg{ position:fixed; left:50%; bottom:max(7vh,env(safe-area-inset-bottom)); z-index:70; width:min(88vw,420px); padding:1.1rem 1.3rem; border-radius:22px; font:1.25rem/1.4 var(--hand); color:var(--olive-deep);
  background:rgba(255,255,255,.92); box-shadow:0 18px 50px rgba(185,101,127,.25); opacity:0; transform:translate(-50%,20px); pointer-events:none; transition:opacity .6s, transform .6s var(--ease); }
#eggMsg.on{ opacity:1; transform:translate(-50%,0); }

/* ============ ADMIN (press P twice) ============ */
#admin{ position:fixed; inset:0; z-index:80; display:none; overflow-y:auto; padding:5vw; background:rgba(251,248,241,.98); text-align:left; user-select:text; }
#admin.open{ display:block; }
#admin .in{ width:min(100%,760px); margin:3vh auto; }
#admin h1{ font:500 1.5rem var(--sans); color:var(--olive); margin-bottom:1rem; }
#admin .x{ position:fixed; top:1rem; right:1.2rem; width:44px; height:44px; border-radius:50%; background:#fff; border:1px solid var(--sky); font-size:1.4rem; color:var(--olive); }
#status{ font-size:.9rem; margin-bottom:1rem; color:var(--olive); }
#status.err{ color:#B3261E; }
table{ width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.05); }
th{ background:var(--sky); padding:.75rem; font-size:.85rem; text-align:left; }
td{ padding:.7rem .75rem; border-bottom:1px solid #EEF3EA; font-size:.9rem; }

@media (max-width:520px){ .glass{ padding:1.8rem 1.1rem; border-radius:26px; } }
@media (prefers-reduced-motion:reduce){
  .blob,.shine,.ch,.btn::after,#yesBtn,#nameInput,.egg,.seal .ring,.who b{ animation:none !important; }
  .scene,.ch,.paper{ transition-duration:.01s !important; }
}
</style>
</head>
<body data-scene="name">

<div class="atmos" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="fx" aria-hidden="true"></canvas>
<canvas id="trail" aria-hidden="true"></canvas>

<main>
  <!-- 1 · NAME -->
  <section id="scr-name" class="scene active" aria-label="Enter your name">
    <div class="glass">
      <p class="prompt shine">I know your name, but tao tumi nije theke likho</p>
      <form id="nameForm" autocomplete="off">
        <input id="nameInput" type="text" placeholder="Tomar naam likho..." maxlength="40" required autocomplete="off">
        <button class="btn" type="submit">Cholo</button>
      </form>
    </div>
  </section>

  <!-- 2 · CHAT -->
  <section id="scr-chat" class="scene" aria-label="Messages">
    <div class="glass" id="chat">
      <div class="who"><b></b>pookie bot</div>
      <div class="slot">
        <p class="msg" id="msg"><span id="msgText"></span><i class="cur"></i></p>
        <div class="dots" aria-label="typing"><i></i><i></i><i></i></div>
      </div>
    </div>
  </section>

  <!-- 3 · PROPOSAL -->
  <section id="scr-proposal" class="scene" aria-label="The proposal">
    <div class="glass">
      <div class="steps" id="steps" aria-hidden="true"></div>
      <p class="question" id="question"></p>
      <p class="plea" id="plea" aria-live="polite">&nbsp;</p>
      <div class="row">
        <button id="yesBtn" type="button">Yes</button>
        <button id="noBtn" type="button">No</button>
      </div>
    </div>
  </section>

  <!-- 4 · FINAL -->
  <section id="scr-final" class="scene" aria-label="Celebration">
    <div class="paper">
      <button class="egg" id="egg" type="button" aria-label="Secret message">♥</button>
      <svg viewBox="0 0 400 290" aria-hidden="true">
        <defs>
          <path id="hp" d="M200 185C168 158 138 132 138 100C138 76 158 58 182 58C192 58 200 64 200 76C200 64 208 58 218 58C242 58 262 76 262 100C262 132 232 158 200 185Z"/>
          <path id="sm" d="M0 6C-10 -1 -7 -10 0 -5C7 -10 10 -1 0 6Z"/>
          <g id="fl"><g fill="currentColor" stroke="#fff"><circle cx="9" r="7"/><circle cx="2.8" cy="8.6" r="7"/><circle cx="-7.3" cy="5.3" r="7"/><circle cx="-7.3" cy="-5.3" r="7"/><circle cx="2.8" cy="-8.6" r="7"/></g><circle r="5" fill="#FBF8F1" stroke="#B4BF95" stroke-width="1.5"/></g>
        </defs>
        <!-- sun with smiley -->
        <g class="pop" style="--d:.4s"><circle cx="58" cy="50" r="17" fill="#F6E7B8" stroke="#B4BF95" stroke-width="3"/>
          <circle cx="52" cy="47" r="1.9" fill="#4F5B38"/><circle cx="64" cy="47" r="1.9" fill="#4F5B38"/>
          <path d="M51 54q7 7 14 0" fill="none" stroke="#4F5B38" stroke-width="2" stroke-linecap="round"/></g>
        <path class="dr" pathLength="1" style="--d:.8s" stroke="#B4BF95" stroke-width="3" d="M58 24v-9M58 76v9M32 50h-9M84 50h9M40 32l-6-6M76 32l6-6M40 68l-6 6M76 68l6 6"/>
        <!-- cloud -->
        <path class="pop" style="--d:.7s" fill="#E8F3FA" stroke="#9CC6E3" stroke-width="3" stroke-linejoin="round" d="M285 70c-12 0-13-15 0-17c0-14 19-17 25-6c8-11 27-4 25 11c13 0 15 12 3 12z"/>
        <!-- big heart -->
        <g class="beat">
          <use class="fade" href="#hp" fill="#FBE6EC" style="--d:2.4s"/>
          <path class="dr" pathLength="1" style="--d:3s;--t:2.2s" stroke="#EBA9BA" stroke-width="7" opacity=".85" d="M150 90L250 98M148 112L252 120M150 134L250 142M162 156L238 162M182 174L218 178"/>
          <use class="dr" href="#hp" pathLength="1" style="--d:1.2s;--t:1.8s" stroke="#6B7A4F" stroke-width="5"/>
          <text class="fade" style="--d:4.8s" x="200" y="128" text-anchor="middle" font-size="25" fill="#4F5B38" font-family="Patrick Hand,Comic Sans MS,cursive" transform="rotate(-6 200 125)">tumi + ami</text>
        </g>
        <!-- grass + flowers -->
        <path class="dr" pathLength="1" style="--d:1s" stroke="#6B7A4F" stroke-width="4" d="M6 272q20-12 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0"/>
        <path class="dr" pathLength="1" style="--d:1.4s" stroke="#6B7A4F" stroke-width="3.5" d="M70 270C66 250 74 236 70 224M140 270C145 258 137 250 140 246M262 270C257 258 265 250 262 246M330 270C334 250 326 236 330 226"/>
        <g class="pop" style="--d:2.1s;color:#EBA9BA"><use href="#fl" x="70" y="218"/></g>
        <g class="pop" style="--d:2.3s;color:#9CC6E3"><use href="#fl" x="140" y="240"/></g>
        <g class="pop" style="--d:2.5s;color:#F6D5DD"><use href="#fl" x="262" y="240"/></g>
        <g class="pop" style="--d:2.7s;color:#9CC6E3"><use href="#fl" x="330" y="220"/></g>
        <!-- heart balloons -->
        <g transform="translate(36 112)">
          <path class="dr" pathLength="1" style="--d:3.6s" stroke="#B4BF95" stroke-width="3" d="M0 22q-8 16 2 30t-2 40"/>
          <path class="dr" pathLength="1" style="--d:3.3s;--t:1.1s" stroke="#EBA9BA" stroke-width="3.5" fill="#F6D5DD" d="M0 22C-26 2 -20 -24 0 -12C20 -24 26 2 0 22Z"/></g>
        <g transform="translate(366 106)">
          <path class="dr" pathLength="1" style="--d:4s" stroke="#B4BF95" stroke-width="3" d="M0 22q8 16 -2 30t2 40"/>
          <path class="dr" pathLength="1" style="--d:3.7s;--t:1.1s" stroke="#9CC6E3" stroke-width="3.5" fill="#E8F3FA" d="M0 22C-26 2 -20 -24 0 -12C20 -24 26 2 0 22Z"/></g>
        <!-- mini hearts + sparkles -->
        <g transform="translate(108 120)"><use class="pop" href="#sm" fill="#EBA9BA" style="--d:5s"/></g>
        <g transform="translate(298 112) scale(1.2)"><use class="pop" href="#sm" fill="#9CC6E3" style="--d:5.2s"/></g>
        <g transform="translate(96 82)"><path class="spk" style="--d:5.4s" d="M0-12L3-3L12 0L3 3L0 12L-3 3L-12 0L-3-3Z"/></g>
        <g transform="translate(240 36)"><path class="spk" style="--d:5.9s" d="M0-12L3-3L12 0L3 3L0 12L-3 3L-12 0L-3-3Z"/></g>
        <g transform="translate(366 160) scale(.9)"><path class="spk" style="--d:6.4s" d="M0-12L3-3L12 0L3 3L0 12L-3 3L-12 0L-3-3Z"/></g>
      </svg>
      <div class="accept" id="accept"></div>
      <span class="sign" id="sign"></span>
      <div class="seal" id="seal" aria-hidden="true"><svg viewBox="0 0 120 120">
        <defs><path id="ringp" d="M60 60m-44 0a44 44 0 1 1 88 0a44 44 0 1 1-88 0"/></defs>
        <circle cx="60" cy="60" r="58" fill="#FBF8F1" stroke="#6B7A4F" stroke-width="3"/>
        <circle cx="60" cy="60" r="54" fill="none" stroke="#6B7A4F" stroke-dasharray="2 3"/>
        <circle cx="60" cy="60" r="31" fill="#F6D5DD" stroke="#6B7A4F" stroke-width="2"/>

        <path d="M60 75C46 64 42 57 42 51C42 45 47 42 52 42C56 42 59 44 60 48C61 44 64 42 68 42C73 42 78 45 78 51C78 57 74 64 60 75Z" fill="#EBA9BA" stroke="#6B7A4F" stroke-width="2"/>

<div id="eggMsg" role="status"></div>
<audio id="music" loop preload="auto"></audio>

<div id="admin" aria-label="Admin panel">
  <button class="x" id="adminX" type="button" aria-label="Close">&times;</button>
  <div class="in">
    <h1>Responses <small id="count"></small></h1>
    <p id="status"></p>
    <table><thead><tr><th>Name</th><th>Answer</th><th>Device</th><th>No clicks</th><th>When</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</div>

<script type="module">
/* =====================================================================
   CONFIG — edit everything personal here
   ===================================================================== */
const CONFIG = {
  nameFallback: "Pookie",           // used if she leaves the name empty
  myName: "[MY NAME]",
  date: "[DATE]",                   // our special date
  joke: "[JOKE]",                   // inside joke / nickname
  loves: ["[LOVE 1]", "[LOVE 2]", "[LOVE 3]"],
  musicUrl: "",                     // <-- put YOUR own mp3 URL here (starts on first tap)
  musicVolume: 0.5,

  // Chat lines. Placeholders: {name} {me} {date} {joke} {love1} {love2} {love3}
  chatLines: [
    "Hey {name}... ekta kotha bolbo? 👀",
    "Ami google e search korsi \"how to impress {name}\", kono result pai nai, tai nijei ashlam 😭",
    "Shotti bolte, ami ektu nervous... hath-pa thanda hoye jasse 🙈",
    "Tumi jano tomar ki ki ami sob theke beshi bhalobashi? {love1}. Ar {love2}. Ar {love3}. 🥹",
    "Ar amader {joke}? Eta mone porle ekhono eka eka hashi ashe 😂",
    "Since {date}, protita din ager theke shundor hoye gese.",
    "{name}, tumi amar bhalo lagar jaygata. Eta fact, no cap.",
    "Tomar jonno ami onek kosto kore ei website banaisi, ektu respect dio 😤",
    "Warning: ei website er shesh e ekta boro question ache.",
    "Ekta choto question ache... ready? 🥹"
  ],

  questions: ["Will you be my wife?", "Will you be my future?", "Will you meow me? 🐱", "You will? 🥹"],
  hints: ["", "Yay! Kintu aro ekta question ache 🤭", "Ei to shesh er dike... 🥺", "Last ta, sure to? 100%? 🥹"],
  pleas: [
    "Please, na bolo na.",
    "Amare hurt koro na please.",
    "Amare chere jeo na please.",
    "Please chere jeo na amar... ami to ototao kharap na je tumi na bolteso."
  ],

  finalLines: [
    ["Yeeey! {name} is my pookie wife now. 🎉", ""],
    ["Official hoye gelo, no refund, no return 😌", ""],
    ["(eita banate onek kosto hoyse, kauke bolish na 🤫)", "small"]
  ],
  signature: "🖍️ nijer haate banaisi,\nonek bhalobasha diye — {me}",
  easterEgg: "Psst... tumi je ei heart ta khuje pele, tar mane tumi sotti amar. I love you, {name}. ♥",

  /* ---- Firebase (optional). Replace with YOUR config; leave databaseURL as "" to disable saving ---- */
  firebase: {
    apiKey: "AIzaSyCXLAfJldSGWOMGJoPTR4dmm4v2f39XOHs",
    authDomain: "waisuuu.firebaseapp.com",
    databaseURL: "https://waisuuu-default-rtdb.firebaseio.com",
    projectId: "waisuuu",
    storageBucket: "waisuuu.firebasestorage.app",
    messagingSenderId: "698109897300",
    appId: "1:698109897300:web:1107e64ec41fd3746f1bc1"
  }
};

/* ============ UTILS ============ */
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
const mobile = matchMedia("(max-width:600px)").matches;
let userName = CONFIG.nameFallback;
const fill = (s) => s.replaceAll("{name}", userName).replaceAll("{me}", CONFIG.myName).replaceAll("{date}", CONFIG.date)
  .replaceAll("{joke}", CONFIG.joke).replaceAll("{love1}", CONFIG.loves[0]).replaceAll("{love2}", CONFIG.loves[1]).replaceAll("{love3}", CONFIG.loves[2]);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const deviceLabel = (ua) => /iPhone/i.test(ua) ? "iPhone" : /iPad/i.test(ua) ? "iPad" : /Android/i.test(ua) ? "Android" : /Mac/i.test(ua) ? "Mac" : /Windows/i.test(ua) ? "Windows PC" : /Linux/i.test(ua) ? "Linux" : "Unknown";

async function typeInto(el, text, speed = 36, alive = () => true) {
  el.textContent = "";
  for (const c of [...text]) {
    if (!alive()) return;
    el.textContent += c;
    await sleep(speed + Math.random() * 22 + (",.?!…".includes(c) ? 160 : 0));
  }
}
function splitChars(el, text) {            // letter-by-letter blur-in, words kept whole so they never break mid-word
  el.setAttribute("aria-label", text); el.textContent = "";
  let i = 0;
  text.split(" ").forEach((word, wi, arr) => {
    const w = document.createElement("span"); w.className = "w"; w.setAttribute("aria-hidden", "true");
    for (const c of [...word]) {
      const s = document.createElement("span"); s.className = "ch"; s.textContent = c;
      s.style.setProperty("--d", (i++ * 0.05).toFixed(2) + "s"); w.appendChild(s);
    }
    el.appendChild(w);
    if (wi < arr.length - 1) { el.appendChild(document.createTextNode(" ")); i++; }
  });
}

/* ============ CANVAS: floating hearts, bursts, touch trail ============ */
const COLORS = ["#F6D5DD", "#EBA9BA", "#CFE4F2", "#9CC6E3", "#B4BF95", "#FFFFFF"];
const fx = $("fx"), fc = fx.getContext("2d"), tr = $("trail"), tc = tr.getContext("2d");
let W = 0, H = 0; const DPR = Math.min(devicePixelRatio || 1, 2);
function resize() { W = innerWidth; H = innerHeight; [fx, tr].forEach((c) => { c.width = W * DPR; c.height = H * DPR; }); fc.setTransform(DPR, 0, 0, DPR, 0, 0); tc.setTransform(DPR, 0, 0, DPR, 0, 0); }
resize(); addEventListener("resize", resize);
const heart = (c, s) => { c.beginPath(); c.moveTo(0, s * .35); c.bezierCurveTo(-s, -s * .3, -s * .55, -s, 0, -s * .45); c.bezierCurveTo(s * .55, -s, s, -s * .3, 0, s * .35); c.fill(); };
const petal = (c, s) => { c.beginPath(); c.moveTo(0, -s); c.bezierCurveTo(s * .9, -s * .4, s * .6, s * .7, 0, s); c.bezierCurveTo(-s * .6, s * .7, -s * .9, -s * .4, 0, -s); c.fill(); };
const rc = () => COLORS[(Math.random() * 5) | 0];

const floaters = reduced ? [] : Array.from({ length: mobile ? 10 : 20 }, () => ({
  x: Math.random() * innerWidth, y: Math.random() * innerHeight, s: 6 + Math.random() * 10, vy: .15 + Math.random() * .35,
  ph: Math.random() * 6.28, sp: .004 + Math.random() * .008, r: Math.random() * 6.28, vr: (Math.random() - .5) * .016, c: rc(), h: Math.random() < .45, a: .3 + Math.random() * .35 }));
let parts = [], trail = [], rise = false, tick = 0;
const MAXP = mobile ? 160 : 320;

function burst(x, y, n = 40) {
  n = Math.min(n, mobile ? 40 : n);
  for (let i = 0; i < n && parts.length < MAXP; i++) { const a = Math.random() * 6.28, v = 2 + Math.random() * 6;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, g: .16, d: .014, s: 5 + Math.random() * 8, r: a, vr: (Math.random() - .5) * .3, c: rc(), h: Math.random() < .6 }); }
}
function firework(x, y) {
  for (let i = 0; i < 28; i++) { const a = i / 28 * 6.283, v = 3 + Math.random() * 2.5;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .05, d: .012, s: 2 + Math.random() * 1.8, r: 0, vr: 0, c: rc(), dot: true }); }
  for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283; parts.push({ x, y, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2, g: .04, d: .011, s: 7, r: 0, vr: .03, c: "#EBA9BA", h: true }); }
}
if (!reduced) {
  addEventListener("pointermove", (e) => { if (tick % 2 === 0 && trail.length < 24) trail.push({ x: e.clientX, y: e.clientY, s: 3 + Math.random() * 4, life: 1, vy: .3 + Math.random() * .4, c: rc() }); });
}
(function loop() {
  tick++;
  if (!reduced) {
    if (rise && tick % 14 === 0 && parts.length < MAXP) parts.push({ x: Math.random() * W, y: H + 12, vx: (Math.random() - .5) * .8, vy: -1.6 - Math.random() * 1.6, g: -.002, d: .004, s: 7 + Math.random() * 10, r: 0, vr: (Math.random() - .5) * .04, c: rc(), h: true });
    fc.clearRect(0, 0, W, H);
    for (const p of floaters) {
      p.y += p.vy; p.ph += p.sp; p.r += p.vr; p.x += Math.sin(p.ph * 3) * .3;
      if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
      fc.save(); fc.translate(p.x, p.y); fc.rotate(p.r); fc.globalAlpha = p.a; fc.fillStyle = p.c; p.h ? heart(fc, p.s) : petal(fc, p.s * .8); fc.restore();
    }
    parts = parts.filter((b) => (b.life = (b.life ?? 1) - b.d) > 0);
    for (const b of parts) {
      b.x += b.vx; b.y += b.vy; b.vy += b.g; b.vx *= .985; b.r += b.vr;
      fc.save(); fc.translate(b.x, b.y); fc.rotate(b.r); fc.globalAlpha = Math.max(b.life, 0); fc.fillStyle = b.c;
      if (b.dot) { fc.beginPath(); fc.arc(0, 0, b.s, 0, 6.28); fc.fill(); } else if (b.h) heart(fc, b.s); else petal(fc, b.s * .8); fc.restore();
    }
    tc.clearRect(0, 0, W, H);
    trail = trail.filter((p) => (p.life -= .035) > 0);
    for (const p of trail) { p.y += p.vy; tc.globalAlpha = p.life; tc.fillStyle = p.c; tc.beginPath(); tc.arc(p.x, p.y, p.s * p.life, 0, 6.28); tc.fill(); }
  }
  requestAnimationFrame(loop);
})();

/* ============ MUSIC (first tap) ============ */
const music = $("music");
if (CONFIG.musicUrl) {
  music.src = CONFIG.musicUrl;
  addEventListener("pointerdown", () => { music.volume = CONFIG.musicVolume; music.play().catch(() => {}); }, { once: true });
}

/* ============ SCENES ============ */
const scenes = { name: $("scr-name"), chat: $("scr-chat"), proposal: $("scr-proposal"), final: $("scr-final") };
function enter(key) {
  Object.values(scenes).forEach((el) => { el.classList.remove("active"); });
  document.body.dataset.scene = key;
  scenes[key].classList.add("active");
}

/* ---- 1 → 2: name → chat ---- */
let started = false;
$("nameForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (started) return; started = true;
  userName = $("nameInput").value.trim() || CONFIG.nameFallback;
  const chat = $("chat"), msg = $("msg"), txt = $("msgText");
  enter("chat"); await sleep(1200);
  for (const line of CONFIG.chatLines) {
    msg.classList.remove("out"); chat.classList.add("think");
    await sleep(750 + Math.random() * 450);
    chat.classList.remove("think");
    await typeInto(txt, fill(line), 36);
    await sleep(1500);
    msg.classList.add("out"); await sleep(550);
  }
  enter("proposal"); showQuestion();
});

/* ---- 3: proposal ---- */
const Q = CONFIG.questions, yes = $("yesBtn"), no = $("noBtn"), plea = $("plea"), qEl = $("question");
let qi = 0, stage = 0, token = 0, totalNo = 0;
const yesS = [1, 1.14, 1.3, 1.55, 1.85], noS = [1, .8, .58, .38, .2];
const renderSteps = () => { $("steps").innerHTML = Q.map((_, i) => `<i class="${i <= qi ? "on" : ""}">♥</i>`).join(""); };
function applyStage() {
  yes.style.transform = `scale(${yesS[Math.min(stage, 4)]})`;
  no.style.transform = `scale(${noS[Math.min(stage, 4)]})`;
  no.style.opacity = Math.max(.95 - stage * .22, .12);
}
function showQuestion() {
  scenes.proposal.classList.remove("reveal");
  splitChars(qEl, Q[qi]); renderSteps();
  requestAnimationFrame(() => requestAnimationFrame(() => scenes.proposal.classList.add("reveal")));
}
no.addEventListener("click", () => {
  if (stage < CONFIG.pleas.length) {
    const my = ++token; typeInto(plea, fill(CONFIG.pleas[stage]), 28, () => my === token);
    stage++; totalNo++; applyStage();
  }
  if (stage >= CONFIG.pleas.length) { no.disabled = true; stage = 4; applyStage(); }
});
yes.addEventListener("click", () => {
  navigator.vibrate?.(30);
  const r = yes.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 40);
  if (qi < Q.length - 1) {
    qi++; stage = 0; no.disabled = false; applyStage(); showQuestion();
    const my = ++token; plea.textContent = ""; typeInto(plea, fill(CONFIG.hints[qi]), 28, () => my === token);
    return;
  }
  navigator.vibrate?.([40, 60, 80]);
  finale();
});

/* ---- 4: final ---- */
async function finale() {
  yes.disabled = no.disabled = true;
  enter("final");
  requestAnimationFrame(() => requestAnimationFrame(() => scenes.final.classList.add("reveal")));
  saveResponse();
  const box = $("accept"); $("sign").textContent = fill(CONFIG.signature);
  await sleep(6300);
  burst(W / 2, H * .4, 40);
  for (const [line, cls] of CONFIG.finalLines) {
    const p = document.createElement("p"); if (cls) p.className = cls; box.appendChild(p);
    await typeInto(p, fill(line), 40); await sleep(450);
  }
  $("sign").classList.add("on"); await sleep(700);
  $("seal").classList.add("on");
  await sleep(650);
  burst(W / 2, H / 2, 40);
  [0, 500, 1000].forEach((d) => setTimeout(() => firework(W * (.2 + Math.random() * .6), H * (.12 + Math.random() * .3)), d));
  setTimeout(() => { rise = true; }, 1200);
}

/* ---- easter egg ---- */
let eggTimer;
$("egg").addEventListener("click", () => {
  const m = $("eggMsg"); m.textContent = fill(CONFIG.easterEgg); m.classList.add("on");
  navigator.vibrate?.(20); const r = $("egg").getBoundingClientRect(); burst(r.left + 24, r.top + 24, 24);
  clearTimeout(eggTimer); eggTimer = setTimeout(() => m.classList.remove("on"), 5000);
});

/* ============ FIREBASE (optional) ============ */
let fb = null;
async function getFb() {
  if (fb || !CONFIG.firebase.databaseURL) return fb;
  try {
    const app = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const dbm = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    fb = { ...dbm, db: dbm.getDatabase(app.initializeApp(CONFIG.firebase)) };
  } catch (err) { console.warn("Firebase unavailable:", err); }
  return fb;
}
async function saveResponse() {
  const f = await getFb(); if (!f) return;
  try {
    await f.set(f.push(f.ref(f.db, "responses")), {
      name: userName.slice(0, 40), answer: "yes", noClicks: totalNo,
      device: deviceLabel(navigator.userAgent), timestamp: f.serverTimestamp()
    });
  } catch (err) { console.warn("Could not save response:", err); }
}

/* ============ ADMIN: press "P" twice ============ */
const admin = $("admin"); let lastP = 0;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") admin.classList.remove("open");
  if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName || "") || e.key.toLowerCase() !== "p") return;
  const now = Date.now();
  if (now - lastP < 500) { admin.classList.add("open"); loadResponses(); lastP = 0; } else lastP = now;
});
$("adminX").addEventListener("click", () => admin.classList.remove("open"));
async function loadResponses() {
  const st = $("status"), rows = $("rows"); st.className = ""; st.textContent = "Loading…"; rows.innerHTML = "";
  const f = await getFb();
  if (!f) { st.className = "err"; st.textContent = "Firebase is not configured."; return; }
  try {
    const data = (await f.get(f.query(f.ref(f.db, "responses"), f.orderByChild("timestamp")))).val();
    if (!data) { st.textContent = "No responses yet."; return; }
    const list = Object.values(data).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    rows.innerHTML = list.map((r) => `<tr><td>${esc(r.name ?? "")}</td><td>${esc(r.answer ?? "")}</td><td>${esc(r.device ?? "—")}</td><td>${esc(r.noClicks ?? 0)}</td><td>${r.timestamp ? esc(new Date(r.timestamp).toLocaleString()) : "—"}</td></tr>`).join("");
    st.textContent = `${list.length} response${list.length === 1 ? "" : "s"}`; $("count").textContent = "";
  } catch (err) { st.className = "err"; st.textContent = "Could not load: " + ((err && err.message) || "unknown error") + ". Check your database rules."; }
}
</script>
