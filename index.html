<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pookie Wife?</title>
<style>
  :root{
    --cream:#FFF6F3;
    --pink:#F2CAD3;
    --pink-deep:#E58CA0;
    --rose:#C9718A;
    --olive:#6B7A4F;
    --ease:cubic-bezier(.22,.61,.12,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--cream)}
  body{
    font-family:"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",Arial,system-ui,sans-serif;
    color:var(--rose);display:grid;place-items:center;text-align:center;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  }
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
  .bg span{
    position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.5;
  }
  .bg .a{background:radial-gradient(circle,var(--pink),transparent 70%);left:-20vmax;top:-20vmax}
  .bg .b{background:radial-gradient(circle,#BCD9EC,transparent 70%);right:-25vmax;bottom:-20vmax}

  .screen{
    position:fixed;inset:0;z-index:1;display:grid;place-items:center;padding:6vw;
    opacity:0;visibility:hidden;transform:scale(1.03);filter:blur(10px);
    transition:opacity 1s var(--ease),transform 1.2s var(--ease),filter 1s var(--ease),visibility 0s 1s;
  }
  .screen.active{
    opacity:1;visibility:visible;transform:none;filter:blur(0);
    transition:opacity .9s var(--ease),transform 1.1s var(--ease),filter .9s var(--ease),visibility 0s;
  }

  .msg{
    font-size:clamp(1.3rem,4.6vw,2.6rem);font-weight:400;line-height:1.5;max-width:18ch;
  }

  /* name entry */
  #scr-name .prompt{font-size:clamp(1.4rem,5vw,2.8rem);margin-bottom:2rem;font-weight:300}
  #scr-name form{display:flex;flex-direction:column;align-items:center;gap:1.2rem;width:min(90vw,420px)}
  #scr-name input{
    width:100%;font-size:1.2rem;padding:.9rem 1.1rem;border-radius:999px;border:2px solid var(--pink);
    background:#fff;color:var(--rose);outline:none;text-align:center;font-family:inherit;
    transition:border-color .3s ease;
  }
  #scr-name input:focus{border-color:var(--pink-deep)}
  #scr-name button{
    padding:.85rem 2.2rem;border-radius:999px;border:none;background:var(--pink-deep);color:#fff;
    font-size:1.05rem;font-family:inherit;cursor:pointer;transition:transform .25s ease,background .25s ease;
  }
  #scr-name button:hover{background:var(--rose)}
  #scr-name button:active{transform:scale(.96)}

  /* proposal */
  #scr-proposal .question{font-size:clamp(1.6rem,6vw,3.2rem);font-weight:300;margin-bottom:1rem}
  #scr-proposal .plea{
    min-height:2.4em;font-size:clamp(1rem,3.4vw,1.4rem);color:var(--rose);opacity:.85;margin-bottom:2.4rem;
    transition:opacity .4s ease;
  }
  .toggle-row{display:flex;gap:1.6rem;align-items:center;justify-content:center;flex-wrap:wrap}
  .toggle-row button{
    border:none;border-radius:999px;font-family:inherit;cursor:pointer;color:#fff;
    transition:transform .45s var(--ease),font-size .45s var(--ease),padding .45s var(--ease),
               background .45s var(--ease),opacity .45s var(--ease);
  }
  #yesBtn{background:var(--pink-deep);font-size:1.3rem;padding:1rem 2.4rem}
  #yesBtn:hover{transform:translateY(-2px)}
  #noBtn{background:var(--olive);font-size:1.1rem;padding:.85rem 1.9rem;opacity:.9}
  #noBtn:disabled{pointer-events:none}

  /* final */
  #scr-final{overflow:hidden}
  #scr-final svg{width:min(90vw,520px);height:auto;margin-bottom:1rem}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s var(--ease) forwards}
  .draw.d1{animation-delay:.1s}
  .draw.d2{animation-delay:.5s}
  .draw.d3{animation-delay:.9s}
  .draw.d4{animation-delay:1.3s}
  .bloom{opacity:0;transform:scale(.3);transform-origin:center;
    animation:bloom 1.1s var(--ease) forwards}
  .bloom.b1{animation-delay:1.6s}
  .bloom.b2{animation-delay:1.9s}
  .bloom.b3{animation-delay:2.1s}
  .bloom.b4{animation-delay:2.3s}
  .bloom.b5{animation-delay:2.5s}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes bloom{to{opacity:1;transform:scale(1)}}
  #scr-final .accept{
    font-size:clamp(1.5rem,5.5vw,2.6rem);font-weight:300;opacity:0;transform:translateY(10px);
    animation:fadeUp 1.2s var(--ease) 2.8s forwards;
  }
  @keyframes fadeUp{to{opacity:1;transform:none}}

  svg path{fill:none;stroke:var(--olive);stroke-width:2;stroke-linecap:round;pathLength:1}
  svg circle,svg ellipse{fill:var(--pink-deep)}

  /* ---------- admin overlay (opens on double "P", no login) ---------- */
  #adminOverlay{
    position:fixed;inset:0;z-index:50;background:var(--cream);display:none;
    place-items:center;padding:6vw;overflow-y:auto;
  }
  #adminOverlay.open{display:grid}
  #adminClose{
    position:absolute;top:1.2rem;right:1.4rem;background:none;border:none;color:var(--rose);
    font-size:1.4rem;cursor:pointer;line-height:1;
  }
  #panel{width:min(100%,720px)}
  #panel h1{font-weight:400;margin-bottom:1.2rem;color:var(--olive)}
  #panel table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
  #panel th,#panel td{padding:.7rem 1rem;text-align:left;border-bottom:1px solid var(--pink);font-size:.95rem}
  #panel th{background:var(--pink);color:#6B3545;font-weight:500}
  #empty{margin-top:1rem;opacity:.7;font-size:.9rem}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span class="a"></span><span class="b"></span></div>

<section id="scr-name" class="screen active">
  <div>
    <p class="prompt">Hey baby, what's your name?</p>
    <form id="nameForm">
      <input id="nameInput" type="text" placeholder="তোমার নাম লেখো..." autocomplete="off" required maxlength="40">
      <button type="submit">চলো</button>
    </form>
  </div>
</section>

<section id="scr-msg1" class="screen">
  <p class="msg" id="msg1Text"></p>
</section>

<section id="scr-msg2" class="screen">
  <p class="msg" id="msg2Text"></p>
</section>

<section id="scr-proposal" class="screen">
  <div>
    <p class="question">Will you be my pookie wife?</p>
    <p class="plea" id="pleaText">&nbsp;</p>
    <div class="toggle-row">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </div>
  </div>
</section>

<section id="scr-final" class="screen">
  <div>
    <svg viewBox="0 0 400 260" aria-hidden="true">
      <path class="draw d1" d="M90 240 C85 180 95 140 92 90 C90 60 100 40 100 20" />
      <path class="draw d2" d="M100 70 C130 55 150 40 170 50" />
      <path class="draw d3" d="M95 110 C65 95 45 80 30 95" />
      <path class="draw d4" d="M300 240 C295 170 305 120 300 70 C298 45 308 25 305 10" />
      <ellipse class="bloom b1" cx="100" cy="18" rx="9" ry="6"/>
      <ellipse class="bloom b2" cx="172" cy="48" rx="8" ry="5"/>
      <ellipse class="bloom b3" cx="28" cy="94" rx="7" ry="5"/>
      <circle class="bloom b4" cx="305" cy="8" r="6"/>
      <circle class="bloom b5" cx="200" cy="130" r="5"/>
    </svg>
    <p class="accept" id="acceptText"></p>
  </div>
</section>

<!-- Admin panel: double-press "P" anywhere (outside the name field) to open. No login. -->
<div id="adminOverlay">
  <button id="adminClose" type="button" aria-label="Close admin panel">&times;</button>
  <div id="panel">
    <h1>Responses</h1>
    <table>
      <thead><tr><th>Name</th><th>Answer</th><th>No clicks</th><th>Time</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" style="display:none">এখনো কেউ উত্তর দেয়নি।</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, query, orderByChild, get, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCXLAfJldSGWOMGJoPTR4dmm4v2f39XOHs",
  authDomain: "waisuuu.firebaseapp.com",
  databaseURL: "https://waisuuu-default-rtdb.firebaseio.com",
  projectId: "waisuuu",
  storageBucket: "waisuuu.firebasestorage.app",
  messagingSenderId: "698109897300",
  appId: "1:698109897300:web:1107e64ec41fd3746f1bc1"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ---------------- proposal flow ---------------- */
const screens = {
  name: document.getElementById("scr-name"),
  msg1: document.getElementById("scr-msg1"),
  msg2: document.getElementById("scr-msg2"),
  proposal: document.getElementById("scr-proposal"),
  final: document.getElementById("scr-final")
};
function show(key){
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[key].classList.add("active");
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

let userName = "";

document.getElementById("nameForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const val = document.getElementById("nameInput").value.trim();
  userName = val || "Baby";

  document.getElementById("msg1Text").textContent = `${userName}, তোমারে হেব্বি ভাল লাগে।`;
  document.getElementById("msg2Text").textContent = `${userName}, তোমারে অনেক ভাল লাগে।`;

  show("msg1");
  await sleep(2600);
  show("msg2");
  await sleep(2600);
  show("proposal");
});

/* --- the evasive No / growing Yes game --- */
const pleas = [
  "প্লিজ, না বোলো না।",
  "আমারে হার্ট কোরো না প্লিজ।",
  "আমারে ছেড়ে যেও না প্লিজ।",
  "প্লিজ ছেড়ে যেও না আমার... আমি তো এতটাও খারাপ না যে তুমি না বলতেছো।"
];
let stage = 0;
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const pleaText = document.getElementById("pleaText");

const yesScale = [1, 1.12, 1.28, 1.5, 1.8];
const noScale  = [1, .82, .62, .42, .22];

function applyStage(){
  yesBtn.style.transform = `scale(${yesScale[Math.min(stage, yesScale.length-1)]})`;
  noBtn.style.transform  = `scale(${noScale[Math.min(stage, noScale.length-1)]})`;
  noBtn.style.opacity = Math.max(.9 - stage * 0.2, .15);
}

noBtn.addEventListener("click", () => {
  if (stage < pleas.length){
    pleaText.style.opacity = 0;
    setTimeout(() => {
      pleaText.textContent = pleas[stage];
      pleaText.style.opacity = .85;
    }, 200);
    stage++;
    applyStage();
  }
  if (stage >= pleas.length){
    noBtn.disabled = true;
    yesBtn.style.transform = `scale(${yesScale[yesScale.length-1]})`;
  }
});

yesBtn.addEventListener("click", async () => {
  yesBtn.disabled = true;
  noBtn.disabled = true;
  show("final");
  document.getElementById("acceptText").textContent =
    `Yeeey! ${userName} is my pookie wife now. 🌿`;

  try{
    const entryRef = push(ref(db, "responses"));
    await set(entryRef, {
      name: userName,
      answer: "yes",
      noClicks: stage,
      timestamp: serverTimestamp()
    });
  }catch(err){
    console.error("Could not save response:", err);
  }
});

/* ---------------- admin panel (no login, public) ---------------- */
const adminOverlay = document.getElementById("adminOverlay");

let lastPTime = 0;
document.addEventListener("keydown", (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return; // don't hijack typing in the name field
  if (e.key.toLowerCase() !== "p") return;

  const now = Date.now();
  if (now - lastPTime < 500){
    openAdmin();
    lastPTime = 0;
  } else {
    lastPTime = now;
  }
});

function openAdmin(){
  adminOverlay.classList.add("open");
  loadResponses();
}
function closeAdmin(){
  adminOverlay.classList.remove("open");
}
document.getElementById("adminClose").addEventListener("click", closeAdmin);

async function loadResponses(){
  const rowsEl = document.getElementById("rows");
  const emptyEl = document.getElementById("empty");
  emptyEl.style.display = "none";
  try{
    const snap = await get(query(ref(db, "responses"), orderByChild("timestamp")));
    const data = snap.val();
    if (!data){ emptyEl.textContent = "এখনো কেউ উত্তর দেয়নি।"; emptyEl.style.display = "block"; return; }

    const entries = Object.values(data).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    rowsEl.innerHTML = entries.map(e => `
      <tr>
        <td>${escapeHtml(e.name || "")}</td>
        <td>${escapeHtml(e.answer || "")}</td>
        <td>${e.noClicks ?? 0}</td>
        <td>${e.timestamp ? new Date(e.timestamp).toLocaleString() : "—"}</td>
      </tr>`).join("");
  }catch(err){
    emptyEl.textContent = "ডেটা লোড করা যায়নি। কনসোল চেক করো।";
    emptyEl.style.display = "block";
    console.error(err);
  }
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
</script>
</body>
</html>
